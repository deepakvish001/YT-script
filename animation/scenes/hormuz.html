<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Hormuz scene</title>
<style>
  @font-face { font-family: Mukta; font-weight: 700; src: url(../node_modules/@fontsource/mukta/files/mukta-devanagari-700-normal.woff2) format('woff2'); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: Mukta; font-weight: 800; src: url(../node_modules/@fontsource/mukta/files/mukta-devanagari-800-normal.woff2) format('woff2'); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: Mukta; font-weight: 700; src: url(../node_modules/@fontsource/mukta/files/mukta-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
  @font-face { font-family: Mukta; font-weight: 800; src: url(../node_modules/@fontsource/mukta/files/mukta-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }

  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #04060b; font-family: Mukta, sans-serif; }
  canvas { position: absolute; inset: 0; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0,0,0,.72) 100%); }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 340px; pointer-events: none;
    background: linear-gradient(to top, rgba(2,4,8,.62), rgba(2,4,8,0)); }
  .cap { position: absolute; left: 0; right: 0; bottom: 96px; text-align: center; color: #fff;
    font-weight: 700; font-size: 60px; line-height: 1.25; opacity: 0;
    text-shadow: 0 3px 18px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); }
  .cap b { color: #ffb020; font-weight: 800; }
  .cap.red b { color: #ff3b30; }
  .label { position: absolute; left: 0; top: 0; opacity: 0; transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .label .tag { color: #fff; font-weight: 800; font-size: 34px; padding: 2px 16px 0; white-space: nowrap;
    background: rgba(8,12,20,.72); border: 1.5px solid rgba(255,59,48,.85); border-radius: 6px; }
  .label .stem { width: 2px; height: 54px; background: linear-gradient(#ff3b30, rgba(255,59,48,0)); }
  .dest { position: absolute; left: 0; top: 0; opacity: 0; transform: translate(-50%, -150%);
    color: #ffd27a; font-weight: 800; font-size: 32px; white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0,0,0,.95); }
  .stat { position: absolute; right: 110px; top: 92px; text-align: right; opacity: 0; }
  .stat .num { color: #ffb020; font-weight: 800; font-size: 168px; line-height: .95;
    text-shadow: 0 0 40px rgba(255,160,0,.35); }
  .stat .sub { color: #d6dee8; font-weight: 700; font-size: 34px; }
  .fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="shade"></div>
<div class="label" id="hormuzLabel"><div class="tag">होर्मुज़ जलडमरूमध्य</div><div class="stem"></div></div>
<div class="stat" id="stat"><div class="num" id="statNum">0%</div><div class="sub">दुनिया का तेल · हर 5वां बैरल</div></div>
<div class="cap" id="capA">दुनिया के नक्शे पर एक ऐसा रास्ता है...</div>
<div class="cap" id="capB">जो सबसे पतली जगह पर सिर्फ <b>करीब 33 KM</b> चौड़ा है</div>
<div class="cap" id="capC">लेकिन दुनिया के तेल का <b>करीब 20%</b> इसी रास्ते से गुज़रता है</div>
<div class="cap red" id="capD">और अगर ये रास्ता <b>बंद</b> हो जाए...?</div>
<div class="fade" id="fade"></div>

<script src="../node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';

const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
// Opacity envelope: fades in over `f` seconds from t0, out over `f` seconds before t1.
const env = (t, t0, t1, f = .35) => clamp((t - t0) / f) * clamp((t1 - t) / f);

// Lat/lon -> point on sphere, matching THREE.SphereGeometry's UV layout.
function ll2v(lat, lon, r = 1) {
  const phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 300);
scene.add(camera);

// ---------- Earth texture (equirectangular, drawn from Natural Earth 1:50m) ----------
const topo = await (await fetch('../node_modules/world-atlas/countries-50m.json')).json();
const countries = topojson.feature(topo, topo.objects.countries);
const TW = 8192, TH = 4096;
const cv = document.createElement('canvas');
cv.width = TW; cv.height = TH;
const g = cv.getContext('2d');
const oceanGrad = g.createLinearGradient(0, 0, 0, TH);
oceanGrad.addColorStop(0, '#0a1424'); oceanGrad.addColorStop(.5, '#0c1d33'); oceanGrad.addColorStop(1, '#0a1424');
g.fillStyle = oceanGrad; g.fillRect(0, 0, TW, TH);

function unwrap(ring) {
  const out = []; let prev = null;
  for (const [lon, lat] of ring) {
    let L = lon;
    if (prev !== null) { while (L - prev > 180) L -= 360; while (L - prev < -180) L += 360; }
    out.push([L, lat]); prev = L;
  }
  return out;
}
function fillPolygon(rings, color) {
  const rs = rings.map(unwrap);
  for (const off of [-360, 0, 360]) {
    g.beginPath();
    for (const r of rs) r.forEach(([lon, lat], i) => {
      const x = (lon + off + 180) / 360 * TW, y = (90 - lat) / 180 * TH;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.fillStyle = color; g.fill('evenodd');
  }
}
const INDIA = '356';
for (const f of countries.features) {
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const color = f.id === INDIA ? '#3a3122' : '#1b2b3d';
  for (const p of polys) fillPolygon(p, color);
}
const tex = new THREE.CanvasTexture(cv);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 192, 192),
  new THREE.MeshPhongMaterial({ map: tex, shininess: 8, specular: 0x1a2a3a })
);
scene.add(globe);

// Crisp vector coastlines and borders on top of the texture.
function meshLines(filter, r) {
  const ml = topojson.mesh(topo, topo.objects.countries, filter);
  const pos = [];
  for (const line of ml.coordinates) for (let i = 1; i < line.length; i++) {
    const [a, b] = [line[i - 1], line[i]];
    if (Math.abs(a[0] - b[0]) > 180) continue;
    pos.push(...ll2v(a[1], a[0], r).toArray(), ...ll2v(b[1], b[0], r).toArray());
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return geo;
}
scene.add(new THREE.LineSegments(meshLines((a, b) => a === b, 1.0008),
  new THREE.LineBasicMaterial({ color: 0x5b95c2, transparent: true, opacity: .85 })));
scene.add(new THREE.LineSegments(meshLines((a, b) => a !== b, 1.0007),
  new THREE.LineBasicMaterial({ color: 0x35587a, transparent: true, opacity: .55 })));

// Lights ride with the camera so the visible face is always lit from upper-left.
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(-3, 2.2, 1.5); camera.add(key);
key.target.position.set(0, 0, -5); camera.add(key.target);

// Atmosphere glow (outer, back faces) + rim light on the globe (front faces).
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.13, 128, 128), new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { c: { value: new THREE.Color(0x3d9cff) } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 c; varying vec3 vN; varying vec3 vV;
    void main(){ float d = -dot(vN, vV); float i = pow(smoothstep(0.0, 0.5, d), 2.4); gl_FragColor = vec4(c * i * 1.1, i); }`
}));
scene.add(atmo);
const rim = new THREE.Mesh(new THREE.SphereGeometry(1.001, 128, 128), new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { c: { value: new THREE.Color(0x4aa8ff) } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 c; varying vec3 vN; varying vec3 vV;
    void main(){ float i = pow(1.0 - max(dot(vN, vV), 0.0), 3.0); gl_FragColor = vec4(c * i * .9, i); }`
}));
scene.add(rim);

// Starfield (seeded so every render is identical).
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
{
  const pos = [], col = [];
  for (let i = 0; i < 5000; i++) {
    const v = new THREE.Vector3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).normalize().multiplyScalar(80 + rnd() * 40);
    pos.push(...v.toArray());
    const b = .35 + rnd() * .65; col.push(b, b, b * (1 + rnd() * .15));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: .22, vertexColors: true, transparent: true, opacity: .9 })));
}

// ---------- Tanker routes out of Hormuz (top 4 destinations per EIA: China, India, Japan, S. Korea) ----------
const HORMUZ = [26.57, 56.25];
const EXIT = [[26.4, 56.6], [24.6, 59.0]];
const EAST_ASIA = [[20, 62], [12, 68], [6.5, 78], [5.6, 81], [6, 90], [6.3, 94.2], [5.6, 98.4], [3.2, 100.4], [2.0, 102.0], [1.2, 103.8], [4, 106], [10, 111], [18, 114.5]];
const ROUTES = [
  { name: 'भारत',        dx: 0,   dy: 0,  pts: [...EXIT, [23.2, 63.5], [22.6, 68.5], [22.45, 69.9]] },
  { name: 'चीन',         dx: -60, dy: 10, pts: [...EXIT, ...EAST_ASIA, [22, 117.5], [26, 120.5], [29.9, 122.2]] },
  { name: 'जापान',       dx: 70,  dy: 0,  pts: [...EXIT, ...EAST_ASIA, [21.2, 120.6], [25, 125.5], [29, 130], [32, 134], [34.2, 137.5], [35.3, 139.8]] },
  { name: 'दक्षिण कोरिया', dx: -40, dy: -6, pts: [...EXIT, ...EAST_ASIA, [21.2, 120.6], [25.5, 123.5], [30, 125.8], [33.5, 128.2], [35.45, 129.4]] },
];

function densePath(pts, r) {
  const out = [];
  for (let i = 1; i < pts.length; i++) {
    const a = ll2v(...pts[i - 1]).normalize(), b = ll2v(...pts[i]).normalize();
    const n = Math.max(2, Math.ceil(a.angleTo(b) / 0.01));
    for (let k = i === 1 ? 0 : 1; k <= n; k++) {
      const q = new THREE.Quaternion().setFromUnitVectors(a, b);
      const v = a.clone().applyQuaternion(new THREE.Quaternion().slerp(q, k / n));
      out.push(v.multiplyScalar(r));
    }
  }
  return out;
}

const routeVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`;
const routeFS = `
  uniform float uTime, uProgress, uRed, uFlow, uOpacity, uLen, uGlow;
  varying vec2 vUv;
  void main(){
    float along = vUv.x;
    if (along > uProgress) discard;
    float dash = fract(along * uLen * 9.0 - uTime * 1.6 * uFlow);
    float pulse = smoothstep(0.0, 0.25, dash) * smoothstep(1.0, 0.55, dash);
    float hw = 0.03 / uLen; // bright head ~0.03 globe-radii long, whatever the route length
    float head = smoothstep(uProgress - hw, uProgress, along) * step(uProgress, 0.999) * (uGlow > 0.5 ? 0.3 : 1.0);
    vec3 amber = vec3(1.0, 0.68, 0.16), red = vec3(1.0, 0.18, 0.12);
    vec3 col = mix(amber, red, uRed);
    float a = (uGlow > 0.5 ? 0.09 : (0.45 + 0.75 * pulse * uFlow + 0.35 * (1.0 - uFlow))) + head * 0.7;
    gl_FragColor = vec4(col * (1.0 + 0.6 * head), a * uOpacity);
  }`;

const routes = ROUTES.map(R => {
  const spline = new THREE.CatmullRomCurve3(densePath(R.pts, 1.004).filter((_, i, a) => i % 6 === 0 || i === a.length - 1), false, 'centripetal', .5);
  const path = spline.getSpacedPoints(800).map(v => v.normalize().multiplyScalar(1.004));
  const curve = new THREE.CatmullRomCurve3(path, false, 'centripetal');
  const len = curve.getLength();
  const mk = (radius, glow) => {
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.ceil(len * 400), radius, 8, false),
      new THREE.ShaderMaterial({
        // Cores blend normally so the three East-Asia routes sharing one lane don't stack into white.
        transparent: true, blending: glow ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false,
        uniforms: { uTime: { value: 0 }, uProgress: { value: 0 }, uRed: { value: 0 }, uFlow: { value: 1 },
          uOpacity: { value: 1 }, uLen: { value: len }, uGlow: { value: glow } },
        vertexShader: routeVS, fragmentShader: routeFS,
      }));
    scene.add(m); return m;
  };
  const end = path[path.length - 1];
  const dot = new THREE.Mesh(new THREE.SphereGeometry(.007, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffc04a, transparent: true, opacity: 0 }));
  dot.position.copy(end); scene.add(dot);
  const el = document.createElement('div'); el.className = 'dest'; el.textContent = R.name; document.body.insertBefore(el, document.getElementById('stat'));
  return { len, core: mk(.0032, 0), glow: mk(.008, 1), end, dot, el, dx: R.dx, dy: R.dy };
});
const maxLen = Math.max(...routes.map(r => r.len));

// Pulsing rings + core dot at Hormuz.
const hzPos = ll2v(...HORMUZ, 1.002);
const rings = [0, 1, 2].map(() => {
  const m = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 64), new THREE.MeshBasicMaterial({
    color: 0xff3b30, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.copy(hzPos); m.lookAt(hzPos.clone().multiplyScalar(2)); scene.add(m); return m;
});
const hzDot = new THREE.Mesh(new THREE.SphereGeometry(.006, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff4a3a, transparent: true, opacity: 0 }));
hzDot.position.copy(hzPos); scene.add(hzDot);

// ---------- Camera path: [time, lat, lon, distance] ----------
const KEYS = [[0, 16, 28, 3.7], [2.6, 19, 42, 3.35], [5.4, 26.2, 56.9, 1.6], [6.3, 26.0, 57.6, 1.6], [9.1, 21, 96, 2.85], [12, 21, 99.5, 2.95]];
function cameraAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, la0, lo0, d0] = KEYS[i], [t1, la1, lo1, d1] = KEYS[i + 1];
  const k = ease(clamp((t - t0) / (t1 - t0)));
  const p = ll2v(lerp(la0, la1, k), lerp(lo0, lo1, k), lerp(d0, d1, k));
  camera.position.copy(p); camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld(); // labels project with this frame's camera, not last frame's
}

function screenOf(v) {
  const p = v.clone().project(camera);
  const facing = v.clone().normalize().dot(camera.position.clone().sub(v).normalize());
  return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H, visible: facing > 0.15 };
}
function place(el, v, alpha, dx = 0, dy = 0) {
  const s = screenOf(v);
  el.style.left = (s.x + dx) + 'px'; el.style.top = (s.y + dy) + 'px';
  el.style.opacity = s.visible ? alpha : 0;
}

const $ = id => document.getElementById(id);
window.renderFrame = (t) => {
  cameraAt(t);

  // Routes grow 6.0s -> ~9.2s at a common speed, then choke red at 9.6s.
  const red = ease(clamp((t - 9.55) / .6));
  routes.forEach(r => {
    const prog = clamp((t - 6.0) * (maxLen / 3.2) / r.len);
    for (const m of [r.core, r.glow]) {
      const u = m.material.uniforms;
      u.uTime.value = t; u.uProgress.value = ease(prog); u.uRed.value = red;
      u.uFlow.value = 1 - red; u.uOpacity.value = 1 - .45 * red;
    }
    r.dot.material.opacity = prog >= 1 ? clamp((t - 6.0 - 3.2 * r.len / maxLen) / .3) * (1 - .5 * red) : 0;
    place(r.el, r.end, r.dot.material.opacity * env(t, 6, 12.2), r.dx, r.dy);
  });

  // Hormuz pulse: starts at 3.8s, faster and brighter once it "closes".
  const on = clamp((t - 3.8) / .5);
  rings.forEach((m, k) => {
    const ph = ((t * (0.75 + red * .6)) + k / 3) % 1;
    m.scale.setScalar(.004 + ph * (.05 + red * .04));
    m.material.opacity = on * (1 - ph) * (.85 + red * .15);
  });
  hzDot.material.opacity = on;
  place($('hormuzLabel'), hzPos, env(t, 4.4, 9.4, .4));

  $('capA').style.opacity = env(t, .4, 2.9);
  $('capB').style.opacity = env(t, 3.2, 5.95);
  $('capC').style.opacity = env(t, 6.2, 9.35);
  $('capD').style.opacity = env(t, 9.75, 13);
  $('stat').style.opacity = env(t, 6.5, 9.35);
  $('statNum').textContent = Math.round(20 * ease(clamp((t - 6.6) / 1.6))) + '%';
  $('fade').style.opacity = clamp((t - 11.45) / .55) + clamp(1 - t / .5);

  renderer.render(scene, camera);
};

await document.fonts.load('700 60px Mukta', 'होर्मुज़ 33 KM');
await document.fonts.load('800 60px Mukta', 'होर्मुज़ 33 KM');
window.renderFrame(0);
window.sceneReady = true;
</script>
</body>
</html>
